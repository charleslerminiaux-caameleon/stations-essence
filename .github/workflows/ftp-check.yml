name: Diagnostic FTP
on:
  push:
    branches: [claude/nifty-volta-eedbx6]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Lister les dossiers vus par le compte FTP
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
          D: ${{ vars.FTP_SERVER_DIR }}
        run: |
          echo "FTP_SERVER_DIR = '$D'"
          for d in "" "public_html/" "domains/" "domains/caameleon.com/public_html/" "stations/" "$D"; do
            echo "===== /$d"
            curl -s --max-time 20 --list-only --user "$U:$P" "ftp://$S/$d" | head -40 || echo "(inaccessible)"
          done
