name: Déploiement Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # chaque lundi : marques des stations mises à jour

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Marques des stations (brands.json)
        run: |
          python3 scripts/build_brands.py brands.json || {
            echo "::warning::Génération impossible, on garde la version en ligne"
            curl -fsS https://stations.caameleon.com/brands.json -o brands.json || rm -f brands.json
          }

      - name: Envoi FTP vers Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Le compte FTP Hostinger démarre dans public_html de caameleon.com :
          # le sous-domaine stations.caameleon.com correspond au dossier stations/.
          server-dir: stations/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            scripts/**
