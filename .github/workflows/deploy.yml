name: Déploiement Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Envoi FTP vers Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Le compte FTP Hostinger démarre dans public_html de caameleon.com :
          # le sous-domaine stations.caameleon.com correspond au dossier stations/.
          server-dir: stations/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
